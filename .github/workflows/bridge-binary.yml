name: Publish Bridge Linux binaries

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Full main-branch commit SHA to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'maplezzk/lark-cli'
    runs-on: ubuntu-latest
    concurrency:
      group: bridge-binary-${{ inputs.revision || github.sha }}
      cancel-in-progress: false
    env:
      REVISION: ${{ inputs.revision || github.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the requested main-branch commit
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$REVISION" HEAD
          git checkout --detach "$REVISION"
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.23.12'
      - name: Build Linux binaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge-assets"
          assets="$RUNNER_TEMP/bridge-assets"
          version="main-$(git rev-parse --short=8 HEAD)"
          for arch in amd64 arm64; do
            binary="$assets/lark-cli-linux-$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" make build BINARY="$binary" VERSION="$version"
            go version -m "$binary" | grep -F "vcs.revision=$REVISION"
            go version -m "$binary" | grep -F "GOARCH=$arch"
            go version -m "$binary" | grep -F "vcs.modified=false"
          done
          "$assets/lark-cli-linux-amd64" --version
          cd "$assets"
          sha256sum lark-cli-linux-amd64 lark-cli-linux-arm64 > checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="bridge-$REVISION"
          assets="$RUNNER_TEMP/bridge-assets"
          if gh release view "$tag" --json isDraft,assets | jq -e '
            .isDraft == false and ([.assets[].name] | sort) ==
              ["checksums.txt", "lark-cli-linux-amd64", "lark-cli-linux-arm64"]
          ' >/dev/null; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$REVISION"
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$REVISION"
          fi
          gh release create "$tag" --target "$REVISION" --title "Bridge binaries $REVISION" \
            --notes "Linux amd64 and arm64 binaries built from $REVISION." --latest=false \
            "$assets/lark-cli-linux-amd64" "$assets/lark-cli-linux-arm64" "$assets/checksums.txt"
